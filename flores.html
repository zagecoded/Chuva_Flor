<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Flores 🌸</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #0b1026, #25104a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .mensagem {
            position: absolute;
            top: 40px;
            color: white;
            text-align: center;
            z-index: 10;
        }

        .mensagem h1 {
            font-size: 42px;
            color: #ff8fc7;
            text-shadow: 0 0 15px #ff4fa3;
        }

        .mensagem p {
            font-size: 20px;
        }

        .jardim {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .flor {
            position: absolute;
            bottom: 0;
            animation: aparecer 2s ease-out forwards;
        }

        .petala {
            position: absolute;
            width: 35px;
            height: 55px;
            background: #ff69b4;
            border-radius: 50%;
            box-shadow: 0 0 15px #ff69b4;
        }

        .p1 { transform: rotate(0deg) translateY(-30px); }
        .p2 { transform: rotate(72deg) translateY(-30px); }
        .p3 { transform: rotate(144deg) translateY(-30px); }
        .p4 { transform: rotate(216deg) translateY(-30px); }
        .p5 { transform: rotate(288deg) translateY(-30px); }

        .centro {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #ffd700;
            border-radius: 50%;
            top: 0;
            left: 3px;
            box-shadow: 0 0 10px #ffd700;
        }

        .caule {
            width: 6px;
            height: 150px;
            background: #3cff78;
            margin-left: 15px;
            border-radius: 10px;
        }

        @keyframes aparecer {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="mensagem">
        <h1>🌸 Toma 🌸</h1>
        <p>Assim como estas flores, que a tua vida seja sempre cheia de beleza. ❤️</p>
    </div>

    <div class="jardim">

        <div class="flor" style="left:15%; animation-delay:0.3s;">
            <div class="petala p1"></div>
            <div class="petala p2"></div>
            <div class="petala p3"></div>
            <div class="petala p4"></div>
            <div class="petala p5"></div>
            <div class="centro"></div>
            <div class="caule"></div>
        </div>

        <div class="flor" style="left:45%; animation-delay:0.8s;">
            <div class="petala p1"></div>
            <div class="petala p2"></div>
            <div class="petala p3"></div>
            <div class="petala p4"></div>
            <div class="petala p5"></div>
            <div class="centro"></div>
            <div class="caule"></div>
        </div>

        <div class="flor" style="left:75%; animation-delay:1.2s;">
            <div class="petala p1"></div>
            <div class="petala p2"></div>
            <div class="petala p3"></div>
            <div class="petala p4"></div>
            <div class="petala p5"></div>
            <div class="centro"></div>
            <div class="caule"></div>
        </div>

    </div>

</body>
</html>
